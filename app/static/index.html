<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bushey Powerwall</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500&family=Barlow+Semi+Condensed:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light;
    --sky: #EEF2F4;
    --panel: #FFFFFF;
    --ink: #1C2A36;
    --muted: #5E6B77;
    --rule: #D5DDE3;
    --solar: #B97D00;
    --battery: #2F8A5F;
    --grid: #6B7785;
    --home: #2F5D9A;
    --alert: #B3261E;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --sky: #16222D;
      --panel: #1E2C38;
      --ink: #E6ECF0;
      --muted: #9AA7B4;
      --rule: #2E3E4C;
      --solar: #F2B632;
      --battery: #4CC08A;
      --grid: #9AA7B4;
      --home: #7FA8E0;
      --alert: #FF8A80;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--sky); color: var(--ink);
    font: 400 1rem/1.5 Barlow, "Segoe UI", system-ui, sans-serif;
  }
  main { max-width: 1100px; margin: 0 auto; padding: clamp(1rem, 4vw, 2.5rem); }
  .num, h1, h2 { font-family: "Barlow Semi Condensed", "Arial Narrow", Barlow, sans-serif; }

  .status { color: var(--muted); font-size: .95rem; margin: 0 0 1rem; }
  .status.bad { color: var(--alert); }

  h1 {
    font-weight: 600; font-size: clamp(2.2rem, 6vw, 4.2rem); line-height: 1.05;
    letter-spacing: -.01em; margin: 0 0 2rem; max-width: 18ch;
  }

  .readings {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 0;
    border-top: 3px solid var(--ink); margin-bottom: 1.5rem;
  }
  .reading { padding: 1rem 1rem 1rem 0; border-right: 1px solid var(--rule); }
  .reading:last-child { border-right: 0; }
  .reading + .reading { padding-left: 1rem; }
  .reading h2 { font-size: 1.05rem; font-weight: 500; margin: 0; }
  .reading .num { font-size: clamp(1.8rem, 4vw, 2.8rem); font-weight: 600; line-height: 1.1; }
  .reading .num small { font-size: .5em; font-weight: 500; margin-left: .15em; }
  .reading p { margin: 0; color: var(--muted); font-size: .9rem; }
  .solar h2, .solar .num { color: var(--solar); }
  .battery h2, .battery .num { color: var(--battery); }
  .grid h2, .grid .num { color: var(--grid); }
  .home h2, .home .num { color: var(--home); }

  .mix { margin: 0 0 2.5rem; }
  .mix p { margin: 0 0 .4rem; color: var(--muted); font-size: .95rem; }
  .bar { display: flex; height: 14px; background: var(--rule); border-radius: 7px; overflow: hidden; }
  .bar span { height: 100%; transition: flex-basis .6s ease; }

  .chart { background: var(--panel); border-radius: 6px; padding: 1rem 1rem .5rem; }
  .chart header { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: .5rem; }
  .chart h2 { font-size: 1.3rem; font-weight: 600; margin: 0; }
  .legend { display: flex; gap: 1rem; font-size: .9rem; color: var(--muted); flex-wrap: wrap; }
  .legend i { display: inline-block; width: .8em; height: .8em; border-radius: 2px; margin-right: .35em; vertical-align: -.05em; }
  canvas { width: 100%; height: 280px; display: block; margin-top: .5rem; }

  .mode { margin-top: 1rem; font-size: .85rem; color: var(--muted); }

  @media (max-width: 700px) {
    .readings { grid-template-columns: 1fr 1fr; }
    .reading { border-right: 0; border-bottom: 1px solid var(--rule); padding-left: 0 !important; }
  }
  @media (prefers-reduced-motion: reduce) { .bar span { transition: none; } }
</style>
</head>
<body>
<main>
  <p class="status" id="status">Connecting…</p>
  <h1 id="headline">Waiting for the Powerwall</h1>

  <section class="readings" aria-label="Live power">
    <div class="reading solar"><h2>Solar</h2><div class="num" id="solar">–</div><p id="solar-note">&nbsp;</p></div>
    <div class="reading home"><h2>House</h2><div class="num" id="home">–</div><p>Using now</p></div>
    <div class="reading battery"><h2>Battery</h2><div class="num" id="pct">–</div><p id="battery-note">&nbsp;</p></div>
    <div class="reading grid"><h2>Grid</h2><div class="num" id="grid">–</div><p id="grid-note">&nbsp;</p></div>
  </section>

  <section class="mix" aria-label="Where the house's power is coming from">
    <p id="mix-text">Where the house's power is coming from</p>
    <div class="bar"><span id="mix-solar" style="background:var(--solar)"></span><span id="mix-battery" style="background:var(--battery)"></span><span id="mix-grid" style="background:var(--grid)"></span></div>
  </section>

  <section class="chart">
    <header>
      <h2>Last 24 hours</h2>
      <div class="legend">
        <span><i style="background:var(--solar)"></i>Solar</span>
        <span><i style="background:var(--home)"></i>House</span>
        <span><i style="background:var(--grid)"></i>Grid</span>
        <span><i style="background:var(--battery)"></i>Battery %</span>
      </div>
    </header>
    <canvas id="chart" role="img" aria-label="Solar, house and grid power over the last 24 hours"></canvas>
  </section>

  <p class="mode" id="mode"></p>
</main>

<script>
const $ = id => document.getElementById(id);
const css = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();

function kw(w) {
  const v = Math.abs(w) / 1000;
  return `${v < 10 ? v.toFixed(1) : v.toFixed(0)}<small>kW</small>`;
}

function headline(d) {
  if (d.grid_status !== "UP") return "The grid is down. The house is running on the battery.";
  const solar = d.solar_w > 50, charging = d.battery_w < -50, discharging = d.battery_w > 50;
  const importing = d.grid_w > 100, exporting = d.grid_w < -100;
  if (solar && charging && exporting) return "The sun is covering the house, filling the battery and selling back.";
  if (solar && charging) return "The sun is covering the house and charging the battery.";
  if (solar && exporting) return "The sun is covering the house and selling the extra.";
  if (solar && importing) return "Solar is helping, but the house is pulling from the grid.";
  if (solar) return "The house is running on solar.";
  if (discharging && !importing) return "The house is running on the battery.";
  if (importing) return "The house is running on the grid.";
  return "Everything is quiet.";
}

async function refreshLive() {
  try {
    const r = await fetch("/api/live");
    const d = await r.json();
    if (!r.ok) throw new Error(d.detail || "No reading yet");

    $("headline").textContent = headline(d);
    $("solar").innerHTML = kw(d.solar_w);
    $("solar-note").textContent = d.solar_w > 50 ? "Producing" : "Not producing";
    $("home").innerHTML = kw(d.home_w);
    $("pct").innerHTML = `${Math.round(d.battery_pct)}<small>%</small>`;
    $("battery-note").textContent = d.battery_w < -50 ? `Charging at ${(Math.abs(d.battery_w)/1000).toFixed(1)} kW`
      : d.battery_w > 50 ? `Powering the house at ${(d.battery_w/1000).toFixed(1)} kW` : "Holding";
    $("grid").innerHTML = kw(d.grid_w);
    $("grid-note").textContent = d.grid_status !== "UP" ? "Down" : d.grid_w > 100 ? "Buying" : d.grid_w < -100 ? "Selling" : "Idle";

    // Where the house's power comes from
    const fromSolar = Math.max(0, Math.min(d.solar_w, d.home_w));
    const fromBattery = Math.max(0, d.battery_w);
    const fromGrid = Math.max(0, d.grid_w);
    const total = fromSolar + fromBattery + fromGrid || 1;
    const pct = v => Math.round(v / total * 100);
    $("mix-solar").style.flexBasis = pct(fromSolar) + "%";
    $("mix-battery").style.flexBasis = pct(fromBattery) + "%";
    $("mix-grid").style.flexBasis = pct(fromGrid) + "%";
    $("mix-text").textContent = `The house is getting ${pct(fromSolar)}% from solar, ${pct(fromBattery)}% from the battery and ${pct(fromGrid)}% from the grid.`;

    const age = Math.round(Date.now() / 1000 - d.ts);
    $("status").textContent = d.stale ? `Last reading was ${age} s ago. Check the Powerwall Wi-Fi connection.` : `Updated ${age} s ago`;
    $("status").className = "status" + (d.stale ? " bad" : "");
    $("mode").textContent = d.mode === "mock" ? "Showing sample data. Set PW_MODE=tedapi in .env to read the Powerwall." : "";
  } catch (e) {
    $("status").textContent = `No data: ${e.message}`;
    $("status").className = "status bad";
  }
}

async function refreshChart() {
  let rows;
  try { rows = await (await fetch("/api/history?hours=24")).json(); } catch { return; }
  const c = $("chart"), dpr = window.devicePixelRatio || 1;
  const W = c.clientWidth, H = c.clientHeight;
  c.width = W * dpr; c.height = H * dpr;
  const g = c.getContext("2d"); g.scale(dpr, dpr); g.clearRect(0, 0, W, H);
  if (!rows.length) { g.fillStyle = css("--muted"); g.font = "15px Barlow, sans-serif"; g.fillText("History appears here after the first few readings.", 8, 24); return; }

  const pad = { l: 40, r: 36, t: 8, b: 22 };
  const now = Date.now() / 1000, t0 = now - 86400;
  const maxW = Math.max(1000, ...rows.map(r => Math.max(r.solar_w, r.home_w, Math.abs(r.grid_w))));
  const minW = Math.min(0, ...rows.map(r => r.grid_w));
  const x = t => pad.l + (t - t0) / 86400 * (W - pad.l - pad.r);
  const y = w => pad.t + (maxW - w) / (maxW - minW) * (H - pad.t - pad.b);
  const yp = p => pad.t + (100 - p) / 100 * (H - pad.t - pad.b);

  // axes
  g.strokeStyle = css("--rule"); g.fillStyle = css("--muted"); g.font = "12px Barlow, sans-serif"; g.lineWidth = 1;
  const step = maxW > 8000 ? 4000 : 2000;
  for (let w = Math.ceil(minW / step) * step; w <= maxW; w += step) {
    g.beginPath(); g.moveTo(pad.l, y(w)); g.lineTo(W - pad.r, y(w)); g.stroke();
    g.fillText(`${w / 1000}`, 4, y(w) + 4);
  }
  for (let h = 0; h <= 24; h += 6) {
    const t = t0 + h * 3600, d = new Date(t * 1000);
    g.fillText(d.toLocaleTimeString([], { hour: "numeric" }), x(t) - 12, H - 4);
  }
  g.fillText("kW", 4, pad.t + 2);

  const line = (key, color, scale, width) => {
    g.strokeStyle = color; g.lineWidth = width; g.beginPath();
    rows.forEach((r, i) => { const px = x(r.ts), py = scale(r[key]); i ? g.lineTo(px, py) : g.moveTo(px, py); });
    g.stroke();
  };
  // solar as a filled area
  g.fillStyle = css("--solar") + "33"; g.beginPath(); g.moveTo(x(rows[0].ts), y(0));
  rows.forEach(r => g.lineTo(x(r.ts), y(r.solar_w))); g.lineTo(x(rows.at(-1).ts), y(0)); g.fill();
  line("solar_w", css("--solar"), y, 2);
  line("home_w", css("--home"), y, 2);
  line("grid_w", css("--grid"), y, 1.5);
  line("battery_pct", css("--battery"), yp, 1.5);
  g.fillStyle = css("--battery"); g.fillText("100%", W - pad.r + 4, yp(100) + 4); g.fillText("0%", W - pad.r + 4, yp(0));
}

refreshLive(); refreshChart();
setInterval(refreshLive, 5000);
setInterval(refreshChart, 60000);
addEventListener("resize", refreshChart);
</script>
</body>
</html>
